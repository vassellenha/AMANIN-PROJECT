<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f7fb">
    <meta name="description" content="Masuk ke AMANIN atau lanjutkan sebagai tamu.">
    <title>Masuk — AMANIN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/auth.css">
  </head>
  <body class="account-page">
    <main class="account-page-main">
      <a class="account-brand" href="index.html" aria-label="AMANIN, kembali ke landing page">
        <img src="assets/amanin-wordmark-transparent.png" alt="AMANIN">
      </a>
      <section class="account-card" aria-labelledby="login-title">
        <span class="account-kicker">RUANG AMAN DIGITALMU</span>
        <h1 id="login-title">Selamat datang.</h1>
        <p class="account-description">Masuk atau lanjutkan sebagai tamu untuk mulai memeriksa.</p>
        <form class="account-form" id="login-form">
          <label class="account-field">Username
            <input id="login-username" name="username" type="text" autocomplete="username" maxlength="32" placeholder="Username kamu" required>
          </label>
          <label class="account-field">Email
            <input id="login-email" name="email" type="email" autocomplete="email" maxlength="120" placeholder="nama@email.com" required>
          </label>
          <p class="account-status" id="login-status" role="status" aria-live="polite"></p>
          <button class="account-submit" type="submit">Masuk ke AMANIN</button>
        </form>
        <div class="account-divider"><span>atau</span></div>
        <button class="account-guest" id="guest-button" type="button">Lanjutkan sebagai tamu</button>
        <a class="account-back-link" href="index.html">Kembali ke landing page</a>
      </section>
    </main>
    <script defer src="js/auth.js"></script>
  </body>
</html>
